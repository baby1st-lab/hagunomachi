<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あと なんかい ねたら？</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#fff7e6 0%,#ffeccd 100%);
  min-height:100vh;color:#4a3728;
  padding:16px 14px calc(24px + env(safe-area-inset-bottom));
}
h1{font-size:22px;text-align:center;margin:4px 0 2px;letter-spacing:.02em}
.today{text-align:center;font-size:14px;color:#8a7560;margin-bottom:16px}
.cards{display:flex;flex-direction:column;gap:14px}
.card{
  background:#fff;border-radius:22px;padding:16px 16px 14px;
  box-shadow:0 3px 0 rgba(0,0,0,.06),0 8px 20px rgba(140,110,70,.13);
  position:relative;overflow:hidden;
}
.card.done{opacity:.5}
.card.today-ev{background:linear-gradient(135deg,#fff3c4,#ffe9a8)}
.row{display:flex;align-items:center;gap:14px}
.emoji{font-size:46px;line-height:1;flex-shrink:0;width:56px;text-align:center}
.info{flex:1;min-width:0}
.name{font-size:20px;font-weight:700;margin-bottom:2px;word-break:break-word}
.date{font-size:13px;color:#9b856c}
.count{margin-top:10px;text-align:center;font-size:17px;color:#6b5744;font-weight:700}
.count b{font-size:44px;color:#ef7d3d;margin:0 4px;vertical-align:-3px}
.count.zero{color:#e0512f;font-size:22px}
.beds{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bed{width:26px;height:26px;border-radius:8px;background:#ffe3c2;display:flex;align-items:center;justify-content:center;font-size:15px}
.bed.past{background:#f0ece6;opacity:.45}
.del{position:absolute;top:8px;right:10px;border:none;background:transparent;font-size:20px;color:#c9bcae;cursor:pointer;padding:6px 8px;line-height:1}
.addbox{margin-top:20px;background:#fff;border-radius:22px;padding:14px;box-shadow:0 8px 20px rgba(140,110,70,.13)}
.addbox summary{font-size:16px;font-weight:700;cursor:pointer;list-style:none;text-align:center;padding:6px}
.addbox summary::-webkit-details-marker{display:none}
.f{margin-top:10px}
.f label{display:block;font-size:13px;color:#8a7560;margin-bottom:4px}
.f input,.f select{width:100%;font-size:17px;padding:11px 12px;border:2px solid #f0e4d2;border-radius:14px;font-family:inherit;background:#fffdfa}
.emojipick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.emojipick button{font-size:26px;width:46px;height:46px;border-radius:14px;border:2px solid #f0e4d2;background:#fffdfa;cursor:pointer}
.emojipick button.sel{border-color:#ef7d3d;background:#fff2e6}
.save{margin-top:14px;width:100%;padding:15px;font-size:18px;font-weight:700;color:#fff;background:#ef7d3d;border:none;border-radius:16px;cursor:pointer;font-family:inherit}
.empty{text-align:center;color:#9b856c;padding:30px 10px;font-size:15px;line-height:1.8}
</style>
</head>
<body>

<h1>あと なんかい ねたら？</h1>
<div class="today" id="todayLabel"></div>

<div class="cards" id="cards"></div>

<details class="addbox">
  <summary>＋ たのしみを ふやす</summary>
  <div class="f">
    <label>なにが あるの？</label>
    <input id="fName" type="text" placeholder="れい：プール" maxlength="20">
  </div>
  <div class="f">
    <label>いつ？</label>
    <input id="fDate" type="date">
  </div>
  <div class="f">
    <label>え を えらぶ</label>
    <div class="emojipick" id="pick"></div>
  </div>
  <button class="save" id="save">とうろく する</button>
</details>

<script>
(function(){
  var KEY = "mitooshi_v1";
  var EMOJIS = ["🏊","🤱","🏥","🚗","🎂","🍰","🎈","🚂","🏠","🐱","🍜","🌊","⚽","🎁","🌟","🍦"];
  var picked = "🌟";

  // 初期データは空(公開リポジトリに家族の予定を置かないため)。予定は端末側で登録し、localStorageにのみ保存される
  var SEED = [];

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return SEED.slice();
  }
  function save(list){
    try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){}
  }

  var events = load();

  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parse(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function nights(dateStr){
    var today = midnight(new Date());
    var t = parse(dateStr);
    return Math.round((t - today) / 86400000);
  }
  var WD = ["にち","げつ","か","すい","もく","きん","ど"];
  function jp(dateStr){
    var d = parse(dateStr);
    return (d.getMonth()+1) + "がつ " + d.getDate() + "にち（" + WD[d.getDay()] + "）";
  }

  function render(){
    var el = document.getElementById("cards");
    el.innerHTML = "";

    var now = new Date();
    document.getElementById("todayLabel").textContent =
      "きょうは " + (now.getMonth()+1) + "がつ" + now.getDate() + "にち（" + WD[now.getDay()] + "）";

    var list = events.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });

    if(!list.length){
      el.innerHTML = '<div class="empty">たのしみが まだ ありません。<br>したの「＋」から ふやしてね。</div>';
      return;
    }

    list.forEach(function(ev){
      var n = nights(ev.date);
      var card = document.createElement("div");
      card.className = "card" + (n < 0 ? " done" : (n === 0 ? " today-ev" : ""));

      var html = '';
      html += '<button class="del" data-name="'+ev.name+'" data-date="'+ev.date+'">×</button>';
      html += '<div class="row">';
      html += '<div class="emoji">' + ev.emoji + '</div>';
      html += '<div class="info"><div class="name">' + ev.name + '</div>';
      html += '<div class="date">' + jp(ev.date) + '</div></div>';
      html += '</div>';

      if(n < 0){
        html += '<div class="count zero">おわったよ</div>';
      }else if(n === 0){
        html += '<div class="count zero">きょう だよ！</div>';
      }else{
        html += '<div class="count">あと <b>' + n + '</b> かい ねたら</div>';
        var beds = '<div class="beds">';
        var show = Math.min(n, 14);
        for(var i=0;i<show;i++){ beds += '<div class="bed">🛏</div>'; }
        if(n > 14){ beds += '<div class="bed past">…</div>'; }
        beds += '</div>';
        html += beds;
      }

      card.innerHTML = html;
      el.appendChild(card);
    });

    Array.prototype.forEach.call(el.querySelectorAll(".del"), function(b){
      b.addEventListener("click", function(){
        var nm = b.getAttribute("data-name"), dt = b.getAttribute("data-date");
        events = events.filter(function(e){ return !(e.name === nm && e.date === dt); });
        save(events); render();
      });
    });
  }

  // 絵文字ピッカー
  var pickEl = document.getElementById("pick");
  EMOJIS.forEach(function(em){
    var b = document.createElement("button");
    b.textContent = em;
    if(em === picked) b.className = "sel";
    b.addEventListener("click", function(){
      picked = em;
      Array.prototype.forEach.call(pickEl.children, function(c){ c.className = ""; });
      b.className = "sel";
    });
    pickEl.appendChild(b);
  });

  document.getElementById("save").addEventListener("click", function(){
    var name = document.getElementById("fName").value.trim();
    var date = document.getElementById("fDate").value;
    if(!name || !date){ alert("なまえ と ひづけ を いれてね"); return; }
    events.push({name:name, date:date, emoji:picked});
    save(events);
    document.getElementById("fName").value = "";
    document.getElementById("fDate").value = "";
    document.querySelector(".addbox").open = false;
    render();
  });

  render();
  // 日付が変わったら数え直す
  setInterval(render, 60000);
})();
</script>
</body>
</html>
