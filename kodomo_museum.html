<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こどもミュージアム</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic",sans-serif;min-height:100vh;color:#5a4a38;
  background:#efe6d2;padding-bottom:86px}

/* ===== ヘッダー ===== */
#head{position:sticky;top:0;z-index:9;background:rgba(239,230,210,.95);backdrop-filter:blur(4px);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
#head .sign{flex:1;background:#fffaf0;border:3px solid #b98b5e;border-radius:14px;text-align:center;
  padding:7px 6px;font-weight:bold;font-size:15px;color:#7a5c38;box-shadow:0 3px 0 rgba(141,123,102,.2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#avatar{width:44px;height:44px;flex:none;border-radius:50%;background:#f4d3da;border:3px solid #b98b5e;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:#fff}

/* ===== おへや(美術館) ===== */
#roomPage{max-width:520px;margin:8px auto;padding:0 12px}
#scene{border:4px solid #8d7b66;border-radius:20px;overflow:hidden;position:relative}
/* 壁: 木の板張り */
#wallzone{position:relative;padding:14px 12px 6px;min-height:280px}
#wallzone.w0{background:repeating-linear-gradient(0deg,#f5e3c4 0 42px,#eeD8b4 42px 44px)}
#wallzone.w1{background:repeating-linear-gradient(0deg,#f7ecdd 0 42px,#eddfca 42px 44px)}
#wallzone.w2{background:repeating-linear-gradient(0deg,#e8ede2 0 42px,#dbe3d3 42px 44px)}
/* ピクチャーレール */
#wallzone::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:#c9a274;border-bottom:3px solid #8d7b66}
#wallTop{display:flex;gap:10px;align-items:stretch}
#window{flex:0 0 34%;border:6px solid #b98b5e;border-radius:14px;background:linear-gradient(#cfe4f2,#e8f3fa 60%,#d3e7cb 61%);
  position:relative;min-height:128px;box-shadow:inset 0 0 0 3px #8d7b66}
#window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#b98b5e}
#window::after{content:"";position:absolute;top:50%;left:0;right:0;height:4px;background:#b98b5e}
#window .sun{position:absolute;top:9%;left:12%;width:26%;aspect-ratio:1;border-radius:50%;background:#f9e3a8;border:3px solid #eccf92}
#window .tree{position:absolute;bottom:6%;right:8%;width:34%;aspect-ratio:.8;border-radius:50% 50% 8% 8%;background:#a8cf9e;border:3px solid #8bb381}
#frames{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frame{background:#fff;border:7px solid #c9a274;outline:3px solid #8d7b66;border-radius:4px;
  position:relative;display:flex;align-items:center;justify-content:center;min-height:56px;cursor:pointer;
  box-shadow:0 4px 8px rgba(90,74,56,.25)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/3}
.frame.empty{background:repeating-linear-gradient(45deg,#faf3e3 0 8px,#f3ead6 8px 16px);cursor:default}
.frame.empty::after{content:"?";font-size:22px;color:#d9c8a8;font-weight:bold}
.frame .plate{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);background:#f7e6b8;
  border:2px solid #b98b5e;border-radius:5px;font-size:8.5px;font-weight:bold;color:#7a5c38;
  padding:1px 8px;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;z-index:2}
#wallBottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px}
.plant{width:44px}
.plant svg{width:100%;height:auto}
/* 棚 */
.shelfrow{padding:0 14px}
.shelfitems{display:flex;gap:12px;align-items:flex-end;min-height:86px;padding:0 6px 2px;overflow-x:auto;scrollbar-width:none}
.shelfitems::-webkit-scrollbar{display:none}
.board{height:12px;background:linear-gradient(#d3ab7c,#b98b5e);border:3px solid #8d7b66;border-radius:6px;
  margin:0 4px 14px;box-shadow:0 6px 6px rgba(90,74,56,.18)}
.stand{flex:none;width:76px;cursor:pointer;position:relative}
.stand .photo{background:#fff;border:3px solid #d9cbb2;border-radius:5px;padding:4px 4px 3px;
  box-shadow:0 3px 5px rgba(90,74,56,.25);transform:rotate(-1deg)}
.stand:nth-child(even) .photo{transform:rotate(1.4deg)}
.stand img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;display:block}
.stand .plate2{margin:3px auto 0;background:#f7e6b8;border:2px solid #b98b5e;border-radius:5px;
  font-size:8px;font-weight:bold;color:#7a5c38;padding:1px 5px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px}
/* 床 */
#floor{height:88px;background:repeating-linear-gradient(90deg,#e0c294 0 54px,#d6b585 54px 108px);
  border-top:4px solid #8d7b66;position:relative}
#rug{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;height:58%;
  background:#f4d3da;border:4px solid #e0b4c0;border-radius:50%;
  box-shadow:inset 0 0 0 6px #fdf0e8}
#rug .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:bold;color:#b48a96;text-align:center;line-height:1.6}

#roomBtns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#roomBtns button{font-family:inherit;font-size:14px;font-weight:bold;border:none;border-radius:999px;
  padding:12px 20px;cursor:pointer;background:#a8cf9e;color:#fff;box-shadow:0 4px 0 #8bb381}
#roomBtns button.sub{background:#cfe0ee;color:#5a6a7a;box-shadow:0 4px 0 #aec4d6}
#file{display:none}
#dispInfo{text-align:center;font-size:11px;color:#a58868;margin-top:8px}

/* ===== ずかん ===== */
#zukanPage{display:none;max-width:520px;margin:10px auto 20px;padding:0 12px}
#zhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#zhead h2{font-size:16px;color:#7a6146}
#zhead button{font-family:inherit;font-size:12px;font-weight:bold;border:none;background:#cfe0ee;color:#5a6a7a;
  border-radius:999px;padding:8px 16px;box-shadow:0 3px 0 #aec4d6;cursor:pointer}
.zcard{background:#fffaf0;border:3px solid #c9ae87;border-radius:16px;padding:12px;margin-bottom:12px;
  display:flex;gap:12px;align-items:flex-start}
.zcard img{width:104px;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid #e5d9c2;flex:none}
.zcard .info{flex:1;min-width:0}
.zcard input[type=text]{width:100%;font-family:inherit;font-size:15px;font-weight:bold;color:#5a4a38;
  border:none;border-bottom:2px dashed #dcc9a2;background:transparent;padding:2px 0}
.zcard input[type=date]{font-family:inherit;font-size:12px;color:#8d7b66;border:none;background:transparent;margin-top:5px}
.zcard .age{display:inline-block;background:#f2b28c;color:#fff;font-size:11px;font-weight:bold;
  border-radius:999px;padding:2px 12px;margin:6px 4px 0 0}
.zcard .rowb{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.zcard .rowb button{font-family:inherit;font-size:11px;border:none;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:bold}
.zcard .disp{background:#a8cf9e;color:#fff}
.zcard .disp.off{background:#e9e0cc;color:#a58868}
.zcard .del{background:#f4d3da;color:#8a5a66}

/* ===== ボトムナビ ===== */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;gap:6px;
  background:rgba(185,139,94,.97);border-top:3px solid #8d7b66;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#nav button{flex:1;font-family:inherit;border:none;border-radius:12px;padding:7px 0 5px;cursor:pointer;
  background:rgba(255,250,240,.25);color:#fff;font-size:10.5px;font-weight:bold;line-height:1.3}
#nav button .ic{font-size:18px;display:block}
#nav button.on{background:#fffaf0;color:#7a5c38}

/* ===== せってい・共通 ===== */
#parent{position:fixed;inset:0;background:rgba(90,74,56,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#parent .inner{background:#fffcf4;border:4px solid #a58868;border-radius:22px;max-width:380px;width:100%;padding:20px;max-height:84vh;overflow-y:auto}
#parent h3{color:#7a6146;font-size:15px;margin:10px 0 6px}
#parent p{font-size:12px;color:#8d7b66;line-height:1.8}
#parent input{font-family:inherit;font-size:14px;padding:6px 10px;border:2px solid #c9ae87;border-radius:10px;margin:4px 0}
#parent button.close{font-family:inherit;font-size:13px;font-weight:bold;border:none;background:#f2d98a;color:#7a6146;
  border-radius:999px;padding:9px 22px;box-shadow:0 3px 0 #dcc06e;cursor:pointer;margin-top:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(122,97,70,.92);color:#fff;
  font-size:13px;font-weight:bold;border-radius:999px;padding:9px 20px;z-index:70;display:none;max-width:90vw;text-align:center}

@media print{
  #head,#nav,#roomPage,#zhead button,.zcard .rowb,#toast{display:none!important}
  #zukanPage{display:block!important;max-width:100%}
  .zcard{break-inside:avoid;border-color:#999}
  body{background:#fff;padding-bottom:0}
}
</style>
</head>
<body>

<div id="head">
  <div class="sign" id="museumName">こどもミュージアム</div>
  <div id="avatar">🎨</div>
</div>

<div id="roomPage">
  <div id="scene">
    <div id="wallzone" class="w0">
      <div id="wallTop">
        <div id="window"><div class="sun"></div><div class="tree"></div></div>
        <div id="frames"></div>
      </div>
      <div id="wallBottom">
        <div class="plant"><svg viewBox="0 0 60 80" fill="none" stroke="#8d7b66" stroke-width="3" stroke-linejoin="round"><path d="M30 46 Q14 36 16 18 Q30 26 30 46 Z" fill="#a8cf9e"/><path d="M30 46 Q46 36 44 18 Q30 26 30 46 Z" fill="#8bb381"/><path d="M30 48 Q30 30 30 14" stroke="#6f9a66"/><path d="M18 50 H42 L38 76 H22 Z" fill="#f2b28c"/></svg></div>
        <div class="plant" style="width:34px"><svg viewBox="0 0 60 80" fill="none" stroke="#8d7b66" stroke-width="3" stroke-linejoin="round"><circle cx="30" cy="26" r="16" fill="#f4d3da"/><path d="M30 42 V60" stroke="#6f9a66"/><path d="M22 62 H38 L35 76 H25 Z" fill="#cfe0ee"/></svg></div>
      </div>
    </div>
    <div class="shelfrow"><div class="shelfitems" id="shelfA"></div><div class="board"></div></div>
    <div class="shelfrow"><div class="shelfitems" id="shelfB"></div><div class="board"></div></div>
    <div id="floor"><div id="rug"><div class="msg" id="rugMsg"></div></div></div>
  </div>
  <div id="dispInfo"></div>
  <div id="roomBtns">
    <button id="addBtn">📷 さくひんをかざる</button>
    <button class="sub" id="wallBtn">かべがみ</button>
  </div>
  <input type="file" id="file" accept="image/*">
</div>

<div id="zukanPage">
  <div id="zhead"><h2>📖 さくひんずかん <span id="zcount"></span></h2>
    <button onclick="window.print()">🖨 いんさつ</button></div>
  <div id="zlist"></div>
</div>

<div id="nav">
  <button id="navRoom" class="on"><span class="ic">🏛</span>おへや</button>
  <button id="navAdd"><span class="ic">📷</span>さつえい</button>
  <button id="navZukan"><span class="ic">📖</span>ずかん</button>
  <button id="navSet"><span class="ic">⚙️</span>せってい</button>
</div>

<div id="parent"><div class="inner">
  <h3>ミュージアムのせってい</h3>
  <p>お子さんの名前: <input type="text" id="kidName" maxlength="8" placeholder="はなこ"></p>
  <p>うまれた月: <input type="month" id="bday"></p>
  <h3>このアプリについて</h3>
  <p>作品は写真に撮ったら現物は感謝して手放してOK、という設計。写真はこの端末の中だけに保存されます。展示できるのは額縁4+棚8の計12点まで — 飾りきれない分は「ずかん(収蔵庫)」にあり、ずかんの「かざる」でいつでも展示替えできます。最初に入っているサンプル3点は、ずかんから削除できます。</p>
  <button class="close" onclick="closeParent()">とじる</button>
</div></div>

<div id="toast"></div>

<script>
/* ===== サンプル作品(初回のみ。削除可能) ===== */
function svgURI(s){ return "data:image/svg+xml;utf8," + encodeURIComponent(s); }
var DEMOS = [
 { title:"たいようと おうち", img: svgURI('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#fffdf5"/><circle cx="48" cy="44" r="22" fill="#f9d97a" stroke="#e8b84a" stroke-width="5"/><g stroke="#e8b84a" stroke-width="5" stroke-linecap="round"><line x1="48" y1="8" x2="48" y2="16"/><line x1="12" y1="44" x2="20" y2="44"/><line x1="22" y1="18" x2="28" y2="24"/></g><rect x="86" y="104" width="84" height="66" fill="#f5b8a0" stroke="#d98a6e" stroke-width="6"/><path d="M78 106 L128 62 L178 106 Z" fill="#e88a7c" stroke="#c96a5c" stroke-width="6" stroke-linejoin="round"/><rect x="118" y="132" width="22" height="38" fill="#a5764a" stroke="#7a5432" stroke-width="5"/><path d="M14 176 Q60 160 100 176 Q150 190 190 174" fill="none" stroke="#8fbf78" stroke-width="8" stroke-linecap="round"/></svg>') },
 { title:"ブロックの おしろ", img: svgURI('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#f4faff"/><rect x="40" y="120" width="120" height="52" fill="#f4b8b8" stroke="#c9848a" stroke-width="5"/><rect x="58" y="82" width="84" height="40" fill="#a5c9e8" stroke="#7a9cbf" stroke-width="5"/><rect x="80" y="46" width="40" height="38" fill="#f9d97a" stroke="#d0ab4a" stroke-width="5"/><path d="M80 46 L100 22 L120 46 Z" fill="#9ecf94" stroke="#74a56c" stroke-width="5" stroke-linejoin="round"/><line x1="100" y1="22" x2="100" y2="8" stroke="#74a56c" stroke-width="4"/><path d="M100 8 h18 l-4 5 4 5 h-18 Z" fill="#e88a7c"/><rect x="92" y="140" width="18" height="32" fill="#8a6a4a"/></svg>') },
 { title:"ねんどの うさぎ", img: svgURI('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#fdf6ee"/><ellipse cx="100" cy="140" rx="52" ry="38" fill="#e8d5c4" stroke="#b89a80" stroke-width="6"/><circle cx="100" cy="82" r="34" fill="#e8d5c4" stroke="#b89a80" stroke-width="6"/><ellipse cx="82" cy="38" rx="11" ry="26" fill="#e8d5c4" stroke="#b89a80" stroke-width="6"/><ellipse cx="118" cy="38" rx="11" ry="26" fill="#e8d5c4" stroke="#b89a80" stroke-width="6"/><circle cx="88" cy="80" r="4" fill="#6a5a48"/><circle cx="112" cy="80" r="4" fill="#6a5a48"/><ellipse cx="78" cy="92" rx="6" ry="4" fill="#f4b8b8"/><ellipse cx="122" cy="92" rx="6" ry="4" fill="#f4b8b8"/><path d="M96 92 q4 4 8 0" fill="none" stroke="#6a5a48" stroke-width="4" stroke-linecap="round"/></svg>') }
];

/* ===== 状態 ===== */
var store = { items: [], wp: 0, birthday: "", name: "", demoDone: false };
function load(){ try{ var s=localStorage.getItem("kodomo_museum_v1"); if(s){ var o=JSON.parse(s);
  ["items","wp","birthday","name","demoDone"].forEach(function(k){ if(o[k]!==undefined) store[k]=o[k]; }); } }catch(e){} }
function save(){
  try{ localStorage.setItem("kodomo_museum_v1", JSON.stringify(store)); return true; }
  catch(e){ toast("保存がいっぱいです。ずかんから古い作品を整理してください"); return false; }
}
load();
// 初回: サンプル3点を展示(お手本+空虚さ対策)
if (!store.demoDone && store.items.length === 0){
  var base = Date.now();
  DEMOS.forEach(function(d,i){
    store.items.push({ id: base+i, img: d.img, title: d.title,
      date: new Date().toISOString().slice(0,10), disp: true, demo: true });
  });
  store.demoDone = true; save();
}

var WALL_MAX = 4, SHELF_MAX = 8;
function q(id){ return document.getElementById(id); }
function toast(t){ var e=q("toast"); e.textContent=t; e.style.display="block";
  clearTimeout(e._t); e._t=setTimeout(function(){ e.style.display="none"; },3000); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function ageAt(dateStr){
  if(!store.birthday || !dateStr) return "";
  var b=store.birthday.split("-"), d=dateStr.split("-");
  var months=(d[0]-b[0])*12 + (parseInt(d[1],10)-parseInt(b[1],10));
  if(months<0) return "";
  var y=Math.floor(months/12), m=months%12;
  return (y>0? y+"さい":"") + (m>0? m+"かげつ" : (y>0?"":"0かげつ"));
}

/* ===== 描画 ===== */
function render(){
  // 看板とアバター
  q("museumName").textContent = (store.name? store.name+"の":"こども") + "ミュージアム";
  q("avatar").textContent = store.name ? store.name[0] : "🎨";

  var disp = store.items.filter(function(it){ return it.disp; });
  var wall = disp.slice(0, WALL_MAX);
  var shelf = disp.slice(WALL_MAX, WALL_MAX + SHELF_MAX);

  // 額縁(常に4枠見せる: 空きは「?」の空き額)
  var fr = q("frames"); fr.innerHTML = "";
  for (var i=0;i<WALL_MAX;i++){
    var f = document.createElement("div");
    if (wall[i]){
      f.className = "frame";
      f.innerHTML = '<img src="'+wall[i].img+'"><span class="plate">'+esc(wall[i].title)+'</span>';
      f.onclick = (function(it){ return function(){ jumpZukan(it.id); }; })(wall[i]);
    } else f.className = "frame empty";
    fr.appendChild(f);
  }
  // 棚(2段に振り分け)
  var sa = q("shelfA"), sb = q("shelfB"); sa.innerHTML=""; sb.innerHTML="";
  shelf.forEach(function(it,i){
    var d = document.createElement("div");
    d.className = "stand";
    d.innerHTML = '<div class="photo"><img src="'+it.img+'"></div><div class="plate2">'+esc(it.title)+'</div>';
    d.onclick = function(){ jumpZukan(it.id); };
    (i%2===0? sa: sb).appendChild(d);
  });
  q("rugMsg").innerHTML = store.items.length
    ? "" : "さくひんを とって<br>かざってみよう!";
  q("wallzone").className = "w"+store.wp;
  var stored = store.items.length - disp.length;
  q("dispInfo").textContent = "てんじ中 " + disp.length + "/12" +
    (stored>0 ? " ・ しゅうぞうこに " + stored + "こ(ずかんから展示替え)" : "");

  // ずかん
  var list=q("zlist"); list.innerHTML="";
  store.items.slice().reverse().forEach(function(it){
    var c=document.createElement("div");
    c.className="zcard"; c.id="zc-"+it.id;
    c.innerHTML='<img src="'+it.img+'"><div class="info">'+
      '<input type="text" value="'+esc(it.title)+'" maxlength="30">'+
      '<br><input type="date" value="'+it.date+'">'+
      '<br><span class="age">'+(ageAt(it.date)||"月齢はせっていから")+'</span>'+
      (it.demo? '<span class="age" style="background:#cfe0ee;color:#5a6a7a">サンプル</span>':'')+
      '<div class="rowb"><button class="disp'+(it.disp?"":" off")+'">'+(it.disp?"てんじ中":"かざる")+'</button>'+
      '<button class="del">さようならする</button></div></div>';
    var inputs=c.querySelectorAll("input");
    inputs[0].onchange=function(){ it.title=this.value||"むだいのさくひん"; save(); render(); };
    inputs[1].onchange=function(){ it.date=this.value; save(); render(); };
    c.querySelector(".disp").onclick=function(){
      if (!it.disp){
        var n = store.items.filter(function(x){ return x.disp; }).length;
        if (n >= WALL_MAX+SHELF_MAX){ toast("てんじは12こまで。どれかを「しまう」してね"); return; }
        it.disp = true; toast("おへやに かざりました!");
      } else { it.disp = false; toast("しゅうぞうこに しまいました"); }
      save(); render();
    };
    c.querySelector(".del").onclick=function(){
      if(!it._arm){ it._arm=true; this.textContent="ほんとうに? (もういちど)"; var self=this;
        setTimeout(function(){ it._arm=false; self.textContent="さようならする"; },2500); return; }
      store.items=store.items.filter(function(x){ return x.id!==it.id; }); save(); render();
      toast("ずかんから さようならしました");
    };
    list.appendChild(c);
  });
  q("zcount").textContent="("+store.items.length+"こ)";
}
function jumpZukan(id){
  showPage("zukan");
  setTimeout(function(){ var c=q("zc-"+id); if(c) c.scrollIntoView({behavior:"smooth",block:"center"}); },60);
}

/* ===== 追加 ===== */
function openCamera(){ q("file").click(); }
q("addBtn").onclick = openCamera;
q("file").onchange=function(){
  var f=this.files[0]; this.value="";
  if(!f) return;
  var img=new Image();
  var url=URL.createObjectURL(f);
  img.onload=function(){
    var MAX=560;
    var sc=Math.min(1, MAX/Math.max(img.width,img.height));
    var cv=document.createElement("canvas");
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    var now=new Date();
    var dispN = store.items.filter(function(x){ return x.disp; }).length;
    var item={ id: Date.now(), img: cv.toDataURL("image/jpeg",.72),
      date: now.toISOString().slice(0,10),
      title: (now.getMonth()+1)+"がつの さくひん",
      disp: dispN < WALL_MAX+SHELF_MAX };
    store.items.push(item);
    if(save()){ render();
      toast(item.disp? "かざりました! なまえはずかんで変えられます"
                     : "てんじがいっぱいなので、しゅうぞうこに入りました"); }
    else store.items.pop();
  };
  img.src=url;
};

/* ===== ナビ・かべがみ・せってい ===== */
function showPage(p){
  q("roomPage").style.display = p==="room"? "block":"none";
  q("zukanPage").style.display = p==="zukan"? "block":"none";
  q("navRoom").className = p==="room"? "on":"";
  q("navZukan").className = p==="zukan"? "on":"";
}
q("navRoom").onclick=function(){ showPage("room"); };
q("navZukan").onclick=function(){ showPage("zukan"); };
q("navAdd").onclick=function(){ showPage("room"); openCamera(); };
q("navSet").onclick=function(){
  q("bday").value=store.birthday; q("kidName").value=store.name;
  q("parent").style.display="flex";
};
q("wallBtn").onclick=function(){ store.wp=(store.wp+1)%3; save(); render(); };
q("bday").onchange=function(){ store.birthday=this.value; save(); render(); };
q("kidName").onchange=function(){ store.name=this.value.trim(); save(); render(); };
function closeParent(){ q("parent").style.display="none"; }

render();
</script>
