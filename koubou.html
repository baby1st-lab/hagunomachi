<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="こうぼう">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>おもちゃこうぼう</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
body{font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic",sans-serif;min-height:100vh;min-height:100dvh;color:#5a4a38;
  background:linear-gradient(#eef1f6,#e3e8f0);display:flex;flex-direction:column;align-items:center;padding:10px 0 104px}
h1{font-size:18px;color:#5a6b86;text-align:center;margin:2px 0 8px}
h1 small{display:block;font-size:11px;color:#8b9ab3;font-weight:normal}

/* せいさくちゅうの でんしゃ */
#stage{width:min(500px,96vw);background:#fffaf0;border:3.5px solid #c9ae87;border-radius:22px;padding:14px 12px;margin-bottom:10px}
#trainName{font-size:15px;font-weight:bold;color:#7a6146;text-align:center}
#rail{position:relative;height:150px;margin-top:6px;display:flex;align-items:flex-end;justify-content:center}
#trainSvg{width:100%;max-width:420px}
#railLine{position:absolute;left:4%;right:4%;bottom:12px;height:8px;background:#d8c9ab;border-radius:99px}
#railLine::after{content:"";position:absolute;inset:2px 0;background:repeating-linear-gradient(90deg,#c9ae87 0 6px,transparent 6px 20px)}
#progress{display:flex;gap:6px;justify-content:center;margin-top:6px}
#progress .pd{width:34px;height:10px;border-radius:99px;background:#e8e2d4;border:2px solid #c9ae87}
#progress .pd.on{background:#a5c9e8}
#hint{text-align:center;font-size:13px;font-weight:bold;color:#7a6146;margin-top:8px;min-height:22px}

/* ぶひんや */
#shopTtl{width:min(500px,96vw);font-size:14px;font-weight:bold;color:#5a6b86;margin:6px 0 4px 10px}
#parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;width:min(500px,96vw)}
.part{background:#fffaf0;border:2.5px solid #c9ae87;border-radius:16px;padding:9px 6px;text-align:center;cursor:pointer;
  box-shadow:0 3px 0 rgba(201,174,135,.35)}
.part:active{transform:scale(.96)}
.part svg{width:52px;height:40px}
.part .nm{font-size:11.5px;font-weight:bold;color:#7a6146}
.part .pr{font-size:11px;font-weight:bold;color:#a58868;display:flex;align-items:center;justify-content:center;gap:2px}
.part .pr svg{width:15px;height:15px}
.part.have{background:#eef7ee;border-color:#a8cf9e}
.part.have .pr{color:#6f9d64}
.part.lock{opacity:.5;background:#f2ede2}
.part.lock .pr{color:#a99f8c}
#doneBtn{font-family:inherit;font-size:15px;font-weight:bold;border:none;background:#a5c9e8;color:#2f4b6b;
  border-radius:999px;padding:12px 28px;box-shadow:0 4px 0 #7fa9cd;cursor:pointer;margin:12px auto 0;display:none}
#stage{text-align:center}
#trainName,#hint{text-align:center}

/* かんせいした でんしゃ */
#garageTtl{width:min(500px,96vw);font-size:14px;font-weight:bold;color:#5a6b86;margin:14px 0 4px 10px}
#garage{display:flex;flex-wrap:wrap;gap:8px;width:min(500px,96vw);justify-content:center}
.gcar{background:#fffaf0;border:2.5px solid #c9ae87;border-radius:14px;padding:8px;text-align:center;width:calc(50% - 4px)}
.gcar svg{width:100%;max-width:150px}
.gcar .nm{font-size:11.5px;font-weight:bold;color:#7a6146;margin-top:2px}
.gcar .gv{font-size:10.5px;color:#8b9ab3}
#empty{font-size:12.5px;color:#8b9ab3;text-align:center;width:100%;padding:10px}

/* おいわい */
#cel{position:fixed;inset:0;background:rgba(90,74,56,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#cel .in{background:#fffcf4;border:4px solid #a58868;border-radius:24px;max-width:380px;width:100%;padding:20px;text-align:center;max-height:78vh;max-height:calc(100dvh - 76px);overflow-y:auto}
#cel svg{width:100%;max-width:260px}
#cel h3{font-size:17px;color:#7a6146;margin:6px 0}
#cel button{font-family:inherit;font-size:14px;font-weight:bold;border:none;background:#f2d98a;color:#7a6146;
  border-radius:999px;padding:11px 26px;box-shadow:0 3px 0 #dcc06e;cursor:pointer;margin:8px 4px 0}

/* もくひょう(第8ラウンド) */
#goal{display:none;margin-top:8px;font-size:12.5px;font-weight:bold;color:#5a6b86;cursor:pointer}
#goal .bar{height:10px;border-radius:99px;background:#e8e2d4;border:2px solid #c9ae87;margin:5px auto 0;max-width:300px;overflow:hidden}
#goal .bar i{display:block;height:100%;width:0;background:#a5c9e8;border-radius:99px;transition:width .6s}
#garageTtl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#madeN{font-size:11.5px;color:#8b9ab3;font-weight:normal}
#depotBtn{margin-left:auto;font-family:inherit;font-size:12.5px;font-weight:bold;border:none;background:#a5c9e8;color:#2f4b6b;
  border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 #7fa9cd;cursor:pointer}
#depotBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #7fa9cd}
/* ながい でんしゃ(共通) */
.fm{position:absolute;left:0;bottom:8px;will-change:transform;cursor:pointer}
.fm .cars{display:flex;align-items:flex-end}
.fm.flip .cars{transform:scaleX(-1)}
.cr{display:block;flex:none}
.cr svg{width:100%;height:100%;display:block}
/* おいわい(100りょう)+もくひょう */
#mile{position:fixed;inset:0;background:rgba(90,74,56,.6);z-index:95;display:none;align-items:center;justify-content:center;
  padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
#mile .in{background:#fffcf4;border:4px solid #a58868;border-radius:24px;max-width:400px;width:100%;padding:16px 12px 14px;text-align:center;
  max-height:78vh;max-height:calc(100dvh - 60px);overflow-y:auto}
#mileTtl{font-size:24px;line-height:1.25;font-weight:bold;color:#7a6146}
#mile .strip{position:relative;height:60px;overflow:hidden;background:#eef4fb;border:2.5px solid #c9ae87;border-radius:14px;margin:10px 0 8px}
#mile .strip .sline{position:absolute;left:0;right:0;bottom:8px;height:6px;background:#d8c9ab}
#mile .strip .sline::after{content:"";position:absolute;inset:1px 0;background:repeating-linear-gradient(90deg,#c9ae87 0 6px,transparent 6px 18px)}
#mile .strip .fm{bottom:12px}
#mileMsg{font-size:13px;color:#8d7b66;margin:0 0 8px}
#mileAsk .q{font-size:15px;font-weight:bold;color:#5a6b86;margin:4px 0 8px}
#mileBtns{display:flex;gap:8px;justify-content:center}
#mileBtns .gbtn{flex:1;max-width:110px;font-family:inherit;font-size:20px;font-weight:bold;border:none;background:#f2d98a;color:#7a6146;
  border-radius:16px;padding:14px 0;box-shadow:0 4px 0 #dcc06e;cursor:pointer}
#mileBtns .gbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #dcc06e}
#mile .other{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}
#mileNum{font-family:inherit;font-size:18px;font-weight:bold;width:130px;padding:9px 6px;border:2.5px solid #c9ae87;border-radius:14px;
  text-align:center;color:#7a6146;background:#fff;-webkit-user-select:text;user-select:text}
#mile .other button,#mile .later{font-family:inherit;font-size:13.5px;font-weight:bold;border:none;background:#e8dcc4;color:#7a6146;
  border-radius:999px;padding:10px 18px;box-shadow:0 3px 0 #cbb99b;cursor:pointer}
#mile .later{display:block;margin:12px auto 0;background:#f2ede2;box-shadow:0 3px 0 #d9d0bf;font-size:12.5px;padding:8px 16px}
.cf{position:fixed;top:-14px;width:10px;height:14px;border-radius:3px;z-index:96;pointer-events:none;animation:cfall 2.8s linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg);opacity:.85}}
/* しゃりょうきち(まち) */
#depot{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:#c9ddb9}
#depot .hd{display:flex;align-items:center;gap:6px;padding:10px 8px 8px;font-size:14px;font-weight:bold;color:#5a6b86;white-space:nowrap;
  background:rgba(255,250,240,.94);border-bottom:3px solid #c9ae87;padding-top:calc(10px + env(safe-area-inset-top))}
#depotN{font-size:12px;color:#8b9ab3;font-weight:normal;white-space:nowrap}
#depot .hd button{font-family:inherit;font-size:12.5px;font-weight:bold;border:none;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
#depotAll{background:#f2d98a;color:#7a6146;box-shadow:0 3px 0 #dcc06e}
#depotX{background:#e8dcc4;color:#7a6146;box-shadow:0 3px 0 #cbb99b;font-size:15px;padding:6px 13px}
#scene{flex:1;position:relative;overflow:hidden;min-height:260px;background:linear-gradient(#cfe0ee 0%,#eaf2fb 46%,#d3e7cb 46%,#c9ddb9 100%)}
#scene .sky{position:absolute;left:0;right:0;top:0;height:46%}
#scene .sky svg{width:100%;height:100%;display:block}
#scene .lane{position:absolute;left:0;right:0;height:34px}
#scene .lane .track{position:absolute;left:0;right:0;bottom:3px;height:7px;background:#d8c9ab;border-radius:99px}
#scene .lane.rail .track::after{content:"";position:absolute;inset:2px 0;background:repeating-linear-gradient(90deg,#c9ae87 0 6px,transparent 6px 18px)}
#scene .lane.road .track{height:13px;background:#cfc7ba;bottom:1px;border-radius:4px}
#scene .lane.road .track::after{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:repeating-linear-gradient(90deg,#fff7ec 0 10px,transparent 10px 22px)}
#scene .sempty{position:absolute;left:0;right:0;top:55%;text-align:center;font-size:13px;color:#7a6146;font-weight:bold}
#deco{position:absolute;right:6px;top:6px;display:flex;gap:2px;align-items:flex-end;background:rgba(255,250,240,.85);
  border:2px solid #c9ae87;border-radius:12px;padding:3px 6px}
#deco span{display:block;width:34px;height:14px}
#deco span svg{width:100%;height:100%;display:block}
#deco b{font-size:11px;color:#7a6146;margin:0 2px 0 0}
#depotToast{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(90,74,56,.85);color:#fff;
  font-size:13px;font-weight:bold;padding:8px 14px;border-radius:999px;display:none;white-space:nowrap;pointer-events:none}
@media (max-height:610px){ #mileTtl{font-size:20px} #mile .strip{height:52px} #mileBtns .gbtn{padding:11px 0;font-size:18px} }

*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* ===== 共通ヘッダー ===== */
#topBar{display:flex;gap:8px;align-items:center;width:min(500px,96vw);margin:0 auto 8px}
#topBar .tb{display:flex;align-items:center;gap:5px;background:rgba(255,250,240,.95);border:2.5px solid #c9ae87;
  border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:bold;color:#7a6146;
  box-shadow:0 3px 0 rgba(141,123,102,.18);white-space:nowrap;cursor:pointer;position:relative;overflow:hidden}
#topBar .tb svg{width:20px;height:20px}
/* ===== 共通フッター ===== */
#appFoot{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;
  background:rgba(255,250,240,.97);border-top:3px solid #c9ae87;box-shadow:0 -3px 10px rgba(141,123,102,.14)}
#appFoot .fbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;text-decoration:none;color:#a58868;font-size:10.5px;font-weight:bold;padding:7px 2px calc(9px + env(safe-area-inset-bottom));
  cursor:pointer;position:relative;background:none;border:none;font-family:inherit}
#appFoot .fbtn .ic{line-height:0}
#appFoot .fbtn .ic svg{width:30px;height:26px;display:block}
#appFoot .fbtn.on{color:#7a6146}
#appFoot .fbtn.on::before{content:"";position:absolute;top:0;left:16%;right:16%;height:4px;
  background:#f2d98a;border-radius:0 0 6px 6px}
</style>
</head>
<body>

<div id="topBar">
  <div class="tb coin" id="footCoin" title="1.5秒ながおしで おうちのひとが+3まい"><span id="footCoinIco"></span>× <span id="footCoinN">0</span></div>
  <div style="flex:1"></div>
  <a class="tb" href="neko_house.html" style="text-decoration:none">🐱 ねこに あげる</a>
</div>

<h1>🔧 おもちゃ こうぼう<small>ぶひんを あつめて おもちゃを つくろう<br>かんせいできたら ねこに みせよう</small></h1>

<div id="stage">
  <div id="trainName"></div>
  <div id="rail"><div id="railLine"></div><div id="trainSvg"></div></div>
  <div id="progress"></div>
  <div id="hint"></div>
  <div id="goal" onclick="openMile(prevMile_(), true)"><span id="goalTxt"></span><div class="bar"><i id="goalFill"></i></div></div>
</div>

<div id="shopTtl"><span style="display:inline-block;width:28px;height:28px;vertical-align:-8px;margin-right:4px"><svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8d7b66" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 22 L13 9 H47 L52 22 Z" fill="#f4d3da"/><path d="M21 9 L19 22 M30 9 V22 M39 9 L41 22"/><path d="M8 22 q5.5 7 11 0 q5.5 7 11 0 q5.5 7 11 0 q5.5 7 11 0" fill="#fff7ec"/><circle cx="30" cy="37" r="9" fill="#f0e3c8"/><circle cx="27" cy="36" r="1.6" fill="#5a4a38" stroke="none"/><circle cx="33" cy="36" r="1.6" fill="#5a4a38" stroke="none"/><path d="M28 40 q2 2 4 0" stroke-width="2"/><circle cx="23.5" cy="39.5" r="2" fill="#f4b8b8" stroke="none"/><circle cx="36.5" cy="39.5" r="2" fill="#f4b8b8" stroke="none"/><rect x="9" y="46" width="42" height="9" rx="3" fill="#f9e3a8"/></svg></span>ぶひんやさん(タップで かう)</div>
<div id="parts"></div>

<div id="garageTtl"><span>🎁 できた おもちゃ</span><span id="madeN"></span><button id="depotBtn" onclick="openDepot()">🚉 しゃりょうきち</button></div>
<div id="garage"></div>

<div id="cel"><div class="in">
  <div id="celSvg"></div>
  <h3 id="celTtl"></h3>
  <p style="font-size:13px;color:#8d7b66" id="celMsg"></p>
  <button onclick="location.href='neko_house.html'">🐱 ねこに みせにいく</button>
  <button onclick="closeCel()" style="background:#e8dcc4;box-shadow:0 3px 0 #cbb99b">つぎを つくる</button>
</div></div>

<div id="mile"><div class="in">
  <div id="mileTtl"></div>
  <div class="strip"><div class="sline"></div><div class="fm" id="mileFm"><div class="cars"></div></div></div>
  <p id="mileMsg"></p>
  <div id="mileAsk">
    <div class="q">つぎは なんりょう まで?</div>
    <div id="mileBtns"></div>
    <div class="other"><input id="mileNum" type="number" inputmode="numeric" min="1" max="9999" placeholder="ほかの かず"><button onclick="mileDecide(0)">きめる</button></div>

  </div>
</div></div>

<div id="depot">
  <div class="hd"><span>🚉 しゃりょうきち</span><span id="depotN"></span><span style="flex:1"></span><button id="depotAll" onclick="depotToggleAll()">ぜんぶ つなぐ!</button><button id="depotX" onclick="closeDepot()">✕</button></div>
  <div id="scene"></div>
  <div id="depotToast"></div>
</div>

<div id="appFoot">
  <a class="fbtn" href="kuruma_parking.html"><span class="ic"><svg viewBox="0 0 80 60" fill="none" stroke="#8d7b66" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M6 44 V38 Q6 32 14 32 L22 32 Q28 18 41 18 L49 18 Q59 18 63 32 Q70 32 70 39 V44 Z" fill="#f4d3da"/><circle cx="20" cy="46" r="7" fill="#ddd7f0"/><circle cx="58" cy="46" r="7" fill="#ddd7f0"/><circle cx="33" cy="37" r="2.5" fill="#8d7b66" stroke="none"/><circle cx="45" cy="37" r="2.5" fill="#8d7b66" stroke="none"/></svg></span>おしたく</a>
  <a class="fbtn" href="mitooshi_calendar.html"><span class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="#8d7b66" stroke-width="4" stroke-linejoin="round"><rect x="7" y="12" width="46" height="42" rx="8" fill="#fff7ec"/><path d="M7 24 H53" stroke-width="3.5"/><rect x="17" y="4" width="5" height="12" rx="2.5" fill="#c9ae87"/><rect x="38" y="4" width="5" height="12" rx="2.5" fill="#c9ae87"/><circle cx="30" cy="39" r="7" fill="#f4b8b8" stroke="none"/></svg></span>カレンダー</a>
  <a class="fbtn" href="ofuro_gacha.html"><span class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="#8d7b66" stroke-width="4" stroke-linejoin="round"><path d="M8 30 a22 22 0 0 1 44 0 Z" fill="#f4d3da"/><path d="M8 30 h44" stroke-width="4"/><path d="M52 30 a22 22 0 0 1 -44 0 Z" fill="#fff7ec"/></svg></span>ガチャ</a>
  <a class="fbtn" href="neko_house.html"><span class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="#8d7b66" stroke-width="4" stroke-linejoin="round"><path d="M16 22 L11 6 L27 14 Z" fill="#f0e3c8"/><path d="M44 22 L49 6 L33 14 Z" fill="#f0e3c8"/><circle cx="30" cy="34" r="20" fill="#f0e3c8"/><circle cx="23" cy="31" r="2.6" fill="#5a4a38" stroke="none"/><circle cx="37" cy="31" r="2.6" fill="#5a4a38" stroke="none"/><path d="M27 40 q3 3 6 0" stroke-width="3"/><circle cx="16" cy="39" r="3.5" fill="#f4b8b8" stroke="none"/><circle cx="44" cy="39" r="3.5" fill="#f4b8b8" stroke="none"/></svg></span>ねこ</a>
</div>

<script>
function q(id){ return document.getElementById(id); }
/* ===== おさいふ(共通) ===== */
function wGet(){ try{ return Math.max(0, JSON.parse(localStorage.getItem("yucoin_wallet_v1")||'{"n":0}').n||0); }catch(e){ return 0; } }
function wSet(n){ try{ localStorage.setItem("yucoin_wallet_v1", JSON.stringify({n:Math.max(0,n)})); }catch(e){} refreshCoin(); }
var COIN='<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="25" fill="#f9e3a8" stroke="#8d7b66" stroke-width="3"/><circle cx="30" cy="30" r="17" fill="none" stroke="#8d7b66" stroke-width="2" stroke-dasharray="3 4"/><text x="30" y="39" text-anchor="middle" font-size="24" font-weight="bold" fill="#8d7b66" font-family="sans-serif">ゆ</text></svg>';
function refreshCoin(){ var n=q("footCoinN"); if(n) n.textContent = wGet(); }

var audioCtx=null;
function blip(f,d,w,t){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  var o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t||"triangle"; o.frequency.value=f;
  g.gain.setValueAtTime(.05,audioCtx.currentTime+(w||0)); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+(w||0)+d);
  o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime+(w||0)); o.stop(audioCtx.currentTime+(w||0)+d); }catch(e){} }
function fanfare(){ [523,659,784,1047].forEach(function(f,i){ blip(f,.22,i*.13); }); }

/* ===== でんしゃの せっけいず ===== */
var TRAINS = [
  { id:"mita",   type:"train", name:"あおい でんしゃ",     color:"#7fb3e8", line:"#3a6fa8", roof:"#e8eef6" },
  { id:"oedo",   type:"train", name:"ももいろ でんしゃ", color:"#e79ec4", line:"#b8437f", roof:"#f7e6ef" },
  { id:"car",    type:"car",   name:"くるま",       color:"#f4d3da", line:"#d9a3b2", roof:"#cfe0ee" },
  { id:"ribbon", type:"ribbon",name:"リボンのかんむり", color:"#f4b8b8", line:"#e8788a", roof:"#f9e3a8" },
  { id:"marunouchi", type:"train", name:"あかい でんしゃ", color:"#e88b7d", line:"#c0392b", roof:"#f8e6e2" },
  { id:"cake",   type:"cake",  name:"ケーキ",       color:"#fff7ec", line:"#f4b8b8", roof:"#f4d3da" },
  { id:"ginza",  type:"train", name:"きいろい でんしゃ",   color:"#f0c274", line:"#c8902f", roof:"#faf0da" },
  { id:"shinkansen", type:"train", name:"はやい でんしゃ", color:"#eef1f6", line:"#3a6fa8", roof:"#dfe6ef" }
];
/* 4つの ぶひん(順番に買う) */
var PARTS = [
  { key:"wheel", name:"どだい",     price:1 },
  { key:"body",  name:"かたち",     price:2 },
  { key:"window",name:"もよう",     price:1 },
  { key:"light", name:"しあげ",     price:2 }
];
var PART_ICON = {

/* でんしゃの絵(部品の数で段階的に完成していく) */
function trainSVG(t, step){
  if (t.type === "car")    return carSVG(t, step);
  if (t.type === "ribbon") return ribbonSVG(t, step);
  if (t.type === "cake")   return cakeSVG(t, step);
  var s = '<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" stroke="#8d7b66" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">';
  if (step >= 1){ // しゃりん
    s += '<circle cx="70" cy="96" r="13" fill="#ddd7f0"/><circle cx="120" cy="96" r="13" fill="#ddd7f0"/>' +
         '<circle cx="185" cy="96" r="13" fill="#ddd7f0"/><circle cx="235" cy="96" r="13" fill="#ddd7f0"/>';
  }
  if (step >= 2){ // ボディ
    s += '<rect x="34" y="34" width="232" height="52" rx="14" fill="'+t.color+'"/>' +
         '<rect x="34" y="34" width="232" height="14" rx="7" fill="'+t.roof+'"/>' +
         '<path d="M34 70 H266" stroke="'+t.line+'" stroke-width="7"/>';
  }
  if (step >= 3){ // まど
    s += '<rect x="52" y="46" width="34" height="20" rx="5" fill="#eef4fb"/>' +
         '<rect x="98" y="46" width="34" height="20" rx="5" fill="#eef4fb"/>' +
         '<rect x="150" y="46" width="34" height="20" rx="5" fill="#eef4fb"/>' +
         '<rect x="200" y="46" width="34" height="20" rx="5" fill="#eef4fb"/>';
  }
  if (step >= 4){ // ライト+かお
    s += '<circle cx="252" cy="76" r="7" fill="#f9e3a8"/><circle cx="46" cy="76" r="7" fill="#f9e3a8"/>' +
         '<circle cx="238" cy="58" r="3" fill="#5a4a38" stroke="none"/><circle cx="256" cy="58" r="3" fill="#5a4a38" stroke="none"/>';
  }
  if (step === 0){
    s += '<text x="150" y="70" text-anchor="middle" font-size="17" fill="#b7c2d4" stroke="none" font-family="sans-serif">ぶひんを かってね</text>';
  }
  s += '</svg>';
  return s;
}

/* ===== データ ===== */
var K = { made:[], cur:null, bought:{}, goal:0, cel:{} };   // goal=つぎの もくひょう(0=なし) / cel=おいわい済みの りょうすう
try{ var raw = localStorage.getItem("koubou_v1"); if (raw){ var o = JSON.parse(raw);
  ["made","cur","bought","goal","cel"].forEach(function(k){ if(o[k]!==undefined) K[k]=o[k]; }); } }catch(e){}
if (!K.cel || typeof K.cel !== "object") K.cel = {};
if (!(K.goal > 0)) K.goal = 0;
function save(){ try{ localStorage.setItem("koubou_v1", JSON.stringify(K)); }catch(e){} }
if (!K.cur) startNext_();

function startNext_(){
  var next = TRAINS.filter(function(t){ return K.made.indexOf(t.id) === -1; })[0];
  K.cur = next ? next.id : TRAINS[K.made.length % TRAINS.length].id;   // 全部作ったら2周目(順番にループ)
  K.bought = {};
  save();
}
function curTrain(){ return TRAINS.filter(function(t){ return t.id === K.cur; })[0] || TRAINS[0]; }
function step_(){ var n=0; PARTS.forEach(function(p){ if(K.bought[p.key]) n++; }); return n; }

/* ===== 描画 ===== */
function render(){
  var t = curTrain(), st = step_();
  q("trainName").textContent = "つくっているのは「" + t.name + "」";
  q("trainSvg").innerHTML = trainSVG(t, st);
  q("railLine").style.display = (t.type === "train") ? "block" : "none";
  var pg = q("progress"); pg.innerHTML = "";
  for (var i=0;i<4;i++) pg.insertAdjacentHTML("beforeend", '<div class="pd'+(i<st?" on":"")+'"></div>');
  var ps = q("parts"); ps.innerHTML = "";
  PARTS.forEach(function(p){
    var have = !!K.bought[p.key];
    var idx = PARTS.indexOf(p);
    var locked = !have && idx > 0 && !K.bought[PARTS[idx-1].key];
    var d = document.createElement("div");
    d.className = "part" + (have ? " have" : "") + (locked ? " lock" : "");
    d.innerHTML = PART_ICON[p.key] +
      '<div class="nm">' + p.name + '</div>' +
      '<div class="pr">' + (have ? "✓ ついた!" : (locked ? "🔒 まだだよ" : COIN + p.price + "まい")) + '</div>';
    if (!have && !locked) d.onclick = function(){ buyPart(p, d); };
    if (locked) d.onclick = function(){ q("hint").textContent = "さきに「" + PARTS[idx-1].name + "」を つけてね"; blip(330,.12); };
    ps.appendChild(d);
  });
  var next = PARTS.filter(function(p){ return !K.bought[p.key]; })[0];
  q("hint").textContent = st >= 4 ? "ぜんぶ そろった!"
    : (next ? "つぎは「" + next.name + "」を かおう(" + next.price + "まい)" : "");
  renderGarage();
  renderGoal();
  var mn = q("madeN"); if (mn) mn.textContent = K.made.length ? "(" + K.made.length + "りょう)" : "";
  refreshCoin();
}
function renderGarage(){
  var g = q("garage"); g.innerHTML = "";
  if (!K.made.length){ g.innerHTML = '<div id="empty">まだ なにも ないよ。<br>ぶひんを あつめて つくろう!</div>'; return; }
  K.made.forEach(function(id, i){
    var t = TRAINS.filter(function(x){ return x.id === id; })[0]; if (!t) return;
    g.insertAdjacentHTML("beforeend",
      '<div class="gcar">' + trainSVG(t, 4) + '<div class="nm">' + t.name + '</div>' +
      '<div class="gv">' + (i+1) + (t.type === "train" ? "りょうめ" : "こめ") + '</div></div>');
  });
}

/* ===== ぶひんを かう ===== */
function buyPart(p, el){
  if (wGet() < p.price){
    q("hint").textContent = "お湯コインが たりないよ(あと " + (p.price - wGet()) + "まい)";
    blip(300,.15);
    return;
  }
  wSet(wGet() - p.price);
  K.bought[p.key] = 1; save();
  blip(523,.09); blip(659,.09,.1); blip(784,.12,.2);
  try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
  el.classList.add("have");
  render();
  // くみたてアニメ(新しい部品がポンと乗る)
  var sv = q("trainSvg");
  sv.style.transition = "transform .3s"; sv.style.transform = "scale(1.06)";
  setTimeout(function(){ sv.style.transform = ""; }, 320);
  // 4つそろったら自動でかんせい(2026-08-21: 「かんせい!」ボタンは廃止。ひと呼吸おいてお祝い)
  if (step_() >= 4) setTimeout(finishToy_, 800);
}

/* ===== かんせい!(自動) ===== */
function finishToy_(){
  if (step_() < 4) return;
  var t = curTrain();
  K.made.push(t.id); save();
  fanfare();
  try{navigator.vibrate&&navigator.vibrate([60,50,60,50,120]);}catch(e){}
  q("celSvg").innerHTML = trainSVG(t, 4);
  q("celTtl").textContent = "🎉 「" + t.name + "」 かんせい!";
  q("celMsg").textContent = "じぶんで つくったね! ねこに みせに いこう";
  if (pendingMile_()) { setTimeout(function(){ openMile(pendingMile_(), false); }, 500); }   // 100りょう等の節目は 大きいお祝いだけ出す
  else q("cel").style.display = "flex";
  // ねこの部屋に「もらったでんしゃ」として渡す
  try{
    var gift = JSON.parse(localStorage.getItem("neko_gift_v1") || "[]");
    gift.push({ id: t.id, name: t.name, at: Date.now() });
    localStorage.setItem("neko_gift_v1", JSON.stringify(gift));
  }catch(e){}
  startNext_();
  render();
}
function closeCel(){ q("cel").style.display = "none"; checkMile(); }

/* ===== もくひょう と 節目の おいわい(第8ラウンド 2026-09-18) =====
   100りょうで1回だけ大きいお祝い → 「つぎは なんりょう まで?」を子が口に出し、おうちのひとが押す。
   目標に届いたらまた同じ流れ。データ: K.goal(つぎの目標) / K.cel({"100":1,...} お祝い済み) */
var FIRST_MILE = 100;
function madeN_(){ return K.made.length; }
function celDone_(m){ return !!K.cel[m]; }
function prevMile_(){ var b = 0; Object.keys(K.cel).forEach(function(k){ var n = +k; if (n <= madeN_() && n > b) b = n; }); return b; }
function pendingMile_(){
  var n = madeN_();
  if (n >= FIRST_MILE && !celDone_(FIRST_MILE)) return FIRST_MILE;
  if (K.goal && n >= K.goal && !celDone_(K.goal)) return K.goal;
  return 0;
}
function checkMile(){ var m = pendingMile_(); if (m) openMile(m, false); }
function renderGoal(){
  var g = q("goal"); if (!g) return;
  if (!K.goal){
    if (celDone_(FIRST_MILE)){ q("goalTxt").textContent = "🎯 つぎの もくひょうを きめる(ここを おす)"; q("goalFill").style.width = "0%"; g.style.display = "block"; }
    else g.style.display = "none";
    return;
  }
  var n = madeN_(), base = prevMile_(), left = Math.max(0, K.goal - n);
  q("goalTxt").textContent = "🎯 もくひょう " + K.goal + "りょう ・ あと " + left + "りょう";
  var pct = K.goal > base ? Math.min(100, Math.max(0, (n - base) / (K.goal - base) * 100)) : 100;
  q("goalFill").style.width = pct + "%";
  g.style.display = "block";
}
var mileCur = 0, mileAsk = false;
function openMile(m, ask){
  mileCur = m; mileAsk = !!ask;
  q("mileTtl").innerHTML = ask ? "🎯 つぎの もくひょう" : ("🎉 " + m + "りょう<br>たっせい!");
  q("mileMsg").textContent = ask ? ("いま " + madeN_() + "りょう。つぎは どこまで?") : "じぶんで ここまで つくったね!";
  var bt = q("mileBtns"); bt.innerHTML = "";
  [m + 50, m + 100, m + 200].forEach(function(v){
    var b = document.createElement("button"); b.className = "gbtn"; b.type = "button"; b.textContent = v;
    b.onclick = function(){ mileDecide(v); }; bt.appendChild(b);
  });
  q("mileNum").value = "";
  q("mile").style.display = "flex";
  var fm = q("mileFm"); fm.querySelector(".cars").innerHTML = trainRow_(K.made.slice().reverse(), 44);   // 左むき(鏡うつし)なので逆順
  fm.classList.add("flip");
  mvClear("mile"); mvAdd({ el:fm, lane:fm.parentNode, dir:-1, v:70, tag:"mile", x:fm.parentNode.clientWidth + 10 }); mvStart();
  if (!ask){ fanfare(); setTimeout(fanfare, 650); try{navigator.vibrate&&navigator.vibrate([80,60,80,60,220]);}catch(e){} confettiMile_(); }
}
function mileDecide(v){
  if (!v){ v = parseInt(q("mileNum").value, 10); }
  if (!(v > madeN_())){ q("mileNum").focus(); blip(300,.15); q("mileMsg").textContent = "いま " + madeN_() + "りょう より おおきい かずに してね"; return; }
  if (mileCur > 0) K.cel[mileCur] = 1;
  K.goal = v; save();
  closeMile(); renderGoal();
  blip(784,.12); blip(1047,.15,.12);
}
function mileLater(){
  if (!mileAsk){ if (mileCur > 0) K.cel[mileCur] = 1; if (K.goal && K.goal <= mileCur) K.goal = 0; save(); }
  closeMile(); renderGoal();
}
function closeMile(){ q("mile").style.display = "none"; mvClear("mile"); }
function confettiMile_(){
  var cols = ["#f4d3da","#cfe0ee","#d3e7cb","#f9e3a8","#ddd7f0","#f5c9a8"];
  for (var i = 0; i < 44; i++){
    var d = document.createElement("div"); d.className = "cf";
    d.style.left = (Math.random()*100) + "vw"; d.style.background = cols[i % cols.length];
    d.style.animationDelay = (Math.random()*1.2) + "s"; d.style.animationDuration = (2.2 + Math.random()*1.4) + "s";
    document.body.appendChild(d);
    (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 4200); })(d);
  }
}

/* ===== ながい でんしゃ(共通の部品) ===== */
function trainById_(id){ return TRAINS.filter(function(x){ return x.id === id; })[0]; }
function flatSVG_(t){   // でんしゃ以外は「かしゃ」に のせて つなぐ
  var inner = trainSVG(t, 4).replace("<svg ", '<svg x="66" y="8" width="168" height="67" ');
  return '<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" stroke="#8d7b66" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">' +
    '<rect x="40" y="74" width="220" height="14" rx="6" fill="#c9ae87"/>' +
    '<circle cx="80" cy="96" r="12" fill="#ddd7f0"/><circle cx="220" cy="96" r="12" fill="#ddd7f0"/>' + inner + '</svg>';
}
function carSmall_(t){ return t.type === "train" ? trainSVG(t, 4) : flatSVG_(t); }
function trainRow_(ids, w){
  var h = Math.round(w * 0.4);
  return ids.map(function(id){ var t = trainById_(id); if (!t) return "";
    return '<span class="cr" style="width:' + w + 'px;height:' + h + 'px">' + carSmall_(t) + '</span>'; }).join("");
}
/* うごかす(1つの requestAnimationFrame で 全部)。m = {el, lane, dir(+1/-1), v(px/秒), tag, x, gap, L(1周の長さ)} */
var MV = { items:[], raf:0, last:0 };
function mvAdd(m){ m.w = m.el.offsetWidth; if (m.x === undefined) m.x = 0; if (m.gap === undefined) m.gap = 24;
  m.el.style.transform = "translateX(" + m.x + "px)"; MV.items.push(m); return m; }
function mvClear(tag){ MV.items = MV.items.filter(function(m){ return m.tag !== tag; }); if (!MV.items.length) mvStop(); }
function mvStart(){ if (MV.raf || !MV.items.length) return; MV.last = performance.now(); MV.raf = requestAnimationFrame(mvTick); }
function mvStop(){ if (MV.raf) cancelAnimationFrame(MV.raf); MV.raf = 0; }
function mvTick(t){
  var dt = Math.min(.1, (t - MV.last) / 1000); MV.last = t;
  MV.items.forEach(function(m){
    var L = m.L || (m.lane.clientWidth + m.w + m.gap * 2);   // 1周 = 画面幅 + 自分の長さ + すきま
    m.x += m.dir * m.v * dt;
    if (m.dir < 0 && m.x < -(m.w + m.gap)) m.x += L;
    if (m.dir > 0 && m.x >= L - (m.w + m.gap)) m.x -= L;
    m.el.style.transform = "translateX(" + m.x + "px)";
  });
  MV.raf = MV.items.length ? requestAnimationFrame(mvTick) : 0;
}

    '<circle cx="' + (x + 25) + '" cy="272" r="1.8" fill="#5a4a38" stroke="none"/><circle cx="' + (x + 35) + '" cy="272" r="1.8" fill="#5a4a38" stroke="none"/>' +
    '<path d="M' + (x + 27) + ' 278 q3 3 6 0" stroke-width="2"/>' +
    '<circle cx="' + (x + 20) + '" cy="277" r="2.4" fill="#f4b8b8" stroke="none"/><circle cx="' + (x + 40) + '" cy="277" r="2.4" fill="#f4b8b8" stroke="none"/></g>';
}
function tree_(x){
  return '<g><rect x="' + (x - 3) + '" y="278" width="6" height="22" rx="2" fill="#a58868"/><circle cx="' + x + '" cy="268" r="16" fill="#a8cf9e"/><circle cx="' + (x - 9) + '" cy="276" r="10" fill="#b9d9ae" stroke="none"/></g>';
}
function openDepot(){ DEPOT.all = false; q("depot").style.display = "flex"; buildScene_(); }
function closeDepot(){ q("depot").style.display = "none"; mvClear("depot"); q("scene").innerHTML = ""; }
function depotToggleAll(){ DEPOT.all = !DEPOT.all; buildScene_(); blip(659,.1); }
function depotToast_(txt){ var t = q("depotToast"); t.textContent = txt; t.style.display = "block"; clearTimeout(t._tm); t._tm = setTimeout(function(){ t.style.display = "none"; }, 1800); }
function addFm_(lane, ids, w, label, x0, gap){
  var d = document.createElement("div"); d.className = "fm" + (lane.dir < 0 ? " flip" : "");
  if (lane.dir < 0) ids = ids.slice().reverse();   // 左むきは鏡うつしになるので、1りょうめが先頭に来るよう逆順に
  d.innerHTML = '<div class="cars">' + trainRow_(ids, w) + '</div>';
  d.onclick = function(){ depotToast_(label); blip(523,.08); };
  lane.el.appendChild(d);
  return mvAdd({ el:d, lane:lane.el, dir:lane.dir, v:lane.v, tag:"depot", x:x0, gap:gap });
}
function buildScene_(){
  var sc = q("scene"); sc.innerHTML = ""; mvClear("depot");
  var n = madeN_();
  q("depotN").textContent = n + "りょう";
  q("depotAll").textContent = DEPOT.all ? "🏘 まちを はしる" : "🚂 ぜんぶ つなぐ";
  q("depotAll").style.display = n ? "" : "none";
  sc.insertAdjacentHTML("beforeend", '<div class="sky">' + SKY_SVG + '</div>');
  var defs = [ {top:50, kind:"rail", dir:-1, v:46}, {top:63, kind:"rail", dir:1, v:34}, {top:76, kind:"rail", dir:-1, v:56}, {top:89, kind:"road", dir:1, v:40} ];
  var lanes = defs.map(function(d){ var l = document.createElement("div"); l.className = "lane " + d.kind; l.style.top = d.top + "%";
    l.innerHTML = '<div class="track"></div>'; sc.appendChild(l); return { el:l, dir:d.dir, v:d.v, kind:d.kind }; });
  if (!n){ sc.insertAdjacentHTML("beforeend", '<div class="sempty">まだ でんしゃが ないよ。<br>こうぼうで つくろう!</div>'); return; }
  var W = sc.clientWidth || 390;
  if (DEPOT.all){
    addFm_({ el:lanes[1].el, dir:-1, v:64 }, K.made.slice(), 56, "ぜんぶ つないだ " + n + "りょう!", W + 20, 40);   // 右から入って左へ
    mvStart(); depotToast_(n + "りょう へんせい しゅっぱつ!"); return;
  }
  // 種類ごとに 8りょうまでの へんせいに 分ける。でんしゃ=せんろ(3本) / くるま=どうろ(1だいずつ) / リボン・ケーキ=まちの かざり
  var by = {}, order = [];
  K.made.forEach(function(id){ if (!by[id]){ by[id] = []; order.push(id); } by[id].push(id); });
  var fms = [], deco = {};
  order.forEach(function(id){ var t = trainById_(id); if (!t) return;
    if (t.type === "train" || t.type === "car"){ var arr = by[id], step = (t.type === "car") ? 1 : 8;
      for (var i = 0; i < arr.length; i += step) fms.push({ t:t, ids:arr.slice(i, i + step) }); }
    else deco[id] = by[id].length; });
  var perLane = [[], [], [], []];
  fms.forEach(function(f){ if (f.t.type === "car") perLane[3].push(f); else { var k = [0,1,2].sort(function(a,b){ return perLane[a].length - perLane[b].length; })[0]; perLane[k].push(f); } });
  perLane.forEach(function(list, li){
    var lane = lanes[li], gap = (li === 3) ? 30 : 60, off = 0, movers = [], maxw = 0;
    list.forEach(function(f){
      var w = f.t.type === "car" ? 46 : 56;
      var label = f.t.name + " " + f.ids.length + (f.t.type === "car" ? "だい" : "りょう");
      var m = addFm_(lane, f.ids, w, label, off, gap);
      off += m.w + gap; maxw = Math.max(maxw, m.w); movers.push(m);
    });
    var L = Math.max(W + maxw + gap * 2, off);   // 1周の長さ = 全部を並べた長さ(重ならない)か 画面幅+最長
    movers.forEach(function(m){ m.L = L; });
  });
  var dk = Object.keys(deco);
  if (dk.length){
    var h = '<div id="deco">';
    dk.forEach(function(id){ var t = trainById_(id); h += '<b>' + deco[id] + '</b><span>' + trainSVG(t, 4) + '</span>'; });
    sc.insertAdjacentHTML("beforeend", h + '</div>');
  }
  mvStart();
}
document.addEventListener("visibilitychange", function(){ if (document.hidden) mvStop(); else if (MV.items.length) mvStart(); });

/* ===== コイン長押しで+3(おうちのひと) ===== */
(function(){
  var t=null, c=q("footCoin");
  function d(){ t=setTimeout(function(){ wSet(wGet()+3); blip(1047,.12); },1500); }
  function u(){ clearTimeout(t); }
  c.addEventListener("mousedown",d); c.addEventListener("mouseup",u); c.addEventListener("mouseleave",u);
  c.addEventListener("touchstart",d,{passive:true}); c.addEventListener("touchend",u);
})();

q("footCoinIco").innerHTML = COIN;
render();
// 旧バージョンで「4つそろったのに かんせいボタンを押していない」状態の救済(自動完成)
if (step_() >= 4) setTimeout(finishToy_, 800);
else setTimeout(checkMile, 500);   // 100りょう等の節目が未お祝いなら(すでに超えていても)1回だけ出す
document.addEventListener("visibilitychange", function(){ if(!document.hidden) render(); });
