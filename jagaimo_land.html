<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>じゃがいもランド</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  body { font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic",sans-serif;
         background:linear-gradient(#fff8e7,#ffeccc); min-height:100vh; text-align:center; overflow-x:hidden; }
  h1 { font-size:clamp(24px,6vw,40px); padding:16px 0 4px; color:#8a5a2b; }
  .sub { color:#b08a5a; font-size:14px; margin-bottom:12px; }
  .menu button, .back { font-size:clamp(20px,5vw,28px); padding:20px 28px; margin:10px; border:none;
    border-radius:24px; background:#ffd98a; color:#6b4a1b; box-shadow:0 6px 0 #e0b060; cursor:pointer; }
  .menu button:active, .back:active { transform:translateY(4px); box-shadow:0 2px 0 #e0b060; }
  .back { font-size:16px; padding:10px 18px; background:#eee; box-shadow:0 4px 0 #ccc; color:#666; margin-top:16px; }
  #question { font-size:clamp(22px,5.5vw,34px); margin:14px 8px; color:#5a3a10; min-height:1.4em; }
  .board { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; padding:8px; max-width:560px; margin:0 auto; }
  .tile { width:clamp(90px,26vw,130px); height:clamp(90px,26vw,130px); border-radius:22px; border:none;
    font-size:clamp(40px,12vw,64px); background:#fff; box-shadow:0 6px 0 rgba(0,0,0,.12); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:transform .15s; }
  .tile:active { transform:scale(.94); }
  .colorTile { font-size:0; }
  #praise { font-size:clamp(26px,7vw,44px); min-height:1.3em; margin-top:10px; }
  .hidden { display:none; }
  .pop { animation:pop .5s; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.35) rotate(-6deg)} 100%{transform:scale(1)} }
  .float { position:fixed; font-size:34px; pointer-events:none; animation:rise 1.4s ease-out forwards; z-index:9; }
  @keyframes rise { to { transform:translateY(-140px) rotate(20deg); opacity:0; } }
  #stars { font-size:22px; letter-spacing:4px; min-height:1.2em; color:#f5a623; }
</style>
</head>
<body>
<h1>🥔 じゃがいもランド</h1>
<div class="sub">まちがいなし・じかんせいげんなし・ぜんぶはなまる</div>
<div id="stars"></div>

<div id="menu" class="menu">
  <button onclick="startColor()">🎨 いろタッチ</button><br>
  <button onclick="startCount()">🔢 かぞえて ぽん</button><br>
  <button onclick="startMemory()">🃏 おぼえて ぺあ</button>
</div>

<div id="game" class="hidden">
  <div id="question"></div>
  <div id="board" class="board"></div>
  <div id="praise"></div>
  <button class="back" onclick="backToMenu()">← もどる</button>
</div>

<script>
var stars = 0, mode = "", audioCtx = null;
var COLORS = [
  {name:"あか", css:"#ff5a5a"}, {name:"あお", css:"#4a90ff"},
  {name:"きいろ", css:"#ffd200"}, {name:"みどり", css:"#3fbf5a"},
  {name:"ピンク", css:"#ff9ad5"}, {name:"むらさき", css:"#9a6adf"}
];
var PRAISES = ["はなまる〜！💮","すごい！⭐","てんさい！✨","やったね！🎉","ぴんぽーん！🔔","かんぺき！🌈"];
var CHEERS = ["🥔","⭐","💮","🎈","✨"];

function q(id){ return document.getElementById(id); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

/* ---- ピコピコ音(素材ファイル不要) ---- */
function beep(freq, dur, when){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime + when);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + when + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + when); o.stop(audioCtx.currentTime + when + dur);
  } catch(e){}
}
function happySound(){ beep(523,.15,0); beep(659,.15,.12); beep(784,.25,.24); }
function tapSound(){ beep(440,.08,0); }

function celebrate(){
  stars++;
  q("stars").textContent = "⭐".repeat(Math.min(stars,20)) + (stars>20?" ×"+stars:"");
  var p = q("praise");
  p.textContent = PRAISES[Math.floor(Math.random()*PRAISES.length)];
  p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop");
  happySound();
  for(var i=0;i<6;i++){
    var s = document.createElement("div");
    s.className = "float"; s.textContent = CHEERS[Math.floor(Math.random()*CHEERS.length)];
    s.style.left = (10+Math.random()*80) + "vw";
    s.style.top = (40+Math.random()*40) + "vh";
    document.body.appendChild(s);
    setTimeout(function(el){ return function(){ el.remove(); }; }(s), 1500);
  }
}
function encourage(btn){
  // まちがい扱いにしない: ヒントとして正解が少し揺れる
  tapSound();
  q("praise").textContent = "おしい！もういっかい 😊";
  if(btn){ btn.style.transform = "scale(.9)"; setTimeout(function(){ btn.style.transform=""; },150); }
}
function showGame(){ q("menu").classList.add("hidden"); q("game").classList.remove("hidden"); q("praise").textContent=""; }
function backToMenu(){ q("game").classList.add("hidden"); q("menu").classList.remove("hidden"); }

/* ---- ゲーム1: いろタッチ ---- */
function startColor(){ mode="color"; showGame(); nextColor(); }
function nextColor(){
  var opts = shuffle(COLORS.slice()).slice(0,4);
  var answer = opts[Math.floor(Math.random()*opts.length)];
  q("question").textContent = "「" + answer.name + "」は どれかな？";
  var b = q("board"); b.innerHTML = "";
  opts.forEach(function(c){
    var t = document.createElement("button");
    t.className = "tile colorTile"; t.style.background = c.css;
    t.setAttribute("aria-label", c.name);
    t.onclick = function(){
      if(c.name === answer.name){ celebrate(); setTimeout(nextColor, 1300); }
      else encourage(t);
    };
    b.appendChild(t);
  });
}

/* ---- ゲーム2: かぞえてぽん ---- */
function startCount(){ mode="count"; showGame(); nextCount(); }
function nextCount(){
  var n = 1 + Math.floor(Math.random()*5);
  q("question").innerHTML = "じゃがいも なんこ？<br><span style='font-size:1.3em'>" + "🥔".repeat(n) + "</span>";
  var opts = shuffle([1,2,3,4,5]).slice(0,3);
  if(opts.indexOf(n) === -1) opts[0] = n;
  shuffle(opts);
  var b = q("board"); b.innerHTML = "";
  opts.forEach(function(k){
    var t = document.createElement("button");
    t.className = "tile"; t.textContent = k;
    t.onclick = function(){
      if(k === n){ celebrate(); setTimeout(nextCount, 1300); }
      else encourage(t);
    };
    b.appendChild(t);
  });
}

/* ---- ゲーム3: おぼえてぺあ(4枚だけの神経衰弱) ---- */
var memOpen = [], memLock = false;
function startMemory(){ mode="mem"; showGame(); nextMemory(); }
function nextMemory(){
  var pool = shuffle(["🐶","🐱","🐰","🐘","🚗","🍎","🍌","🥔"]).slice(0,2);
  var cards = shuffle([pool[0],pool[0],pool[1],pool[1]]);
  memOpen = []; memLock = false;
  q("question").textContent = "おなじ どうし を みつけてね";
  var b = q("board"); b.innerHTML = "";
  cards.forEach(function(face){
    var t = document.createElement("button");
    t.className = "tile"; t.textContent = "❓"; t.dataset.face = face; t.dataset.done = "";
    t.onclick = function(){
      if(memLock || t.dataset.done || t.textContent !== "❓") return;
      tapSound(); t.textContent = face; memOpen.push(t);
      if(memOpen.length === 2){
        memLock = true;
        var a = memOpen[0], c = memOpen[1];
        if(a.dataset.face === c.dataset.face){
          a.dataset.done = "1"; c.dataset.done = "1";
          memOpen = []; memLock = false;
          var left = Array.prototype.filter.call(b.children, function(x){ return !x.dataset.done; });
          if(left.length === 0){ celebrate(); setTimeout(nextMemory, 1500); }
          else happySound();
        } else {
          setTimeout(function(){
            a.textContent = "❓"; c.textContent = "❓";
            memOpen = []; memLock = false;
            q("praise").textContent = "もういっかい みてみよう 👀";
          }, 900);
        }
      }
    };
    b.appendChild(t);
  });
}
</script>
</body>
</html>
